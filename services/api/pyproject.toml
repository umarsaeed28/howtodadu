[project]
name = "pencil-api"
version = "0.1.0"
description = "Pencil backend: DADU assessments (LangGraph), RAG on Postgres/pgvector, feedback."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "langgraph>=0.2.60",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-groq>=0.2",
  "opik>=1.0",
  "sentry-sdk[fastapi]>=2.10",
  "tiktoken>=0.7",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # line length is the formatter's job; long lines left are prompt text and SQL

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/chunking.py"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "opik.*", "langchain_groq.*", "tiktoken.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.chunking"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
